services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xui -d xui_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: abakdev/3x-ui-traffic-monitor:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Publish the same port the panel binds (change both sides if you change web_port).
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://xui:xui@db:5432/xui_monitor
      STATIC_DIR: /app/frontend/dist
      SERVERS_YAML: /config/servers.yaml
      PANEL_SETTINGS_DB: /config/panel.db
      WEB_PORT: ${WEB_PORT:-8000}
    volumes:
      - "./config:/config"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
